name: release
on:
  push:
    branches: [main]
    paths-ignore:
      - "public/screenshots/**"
      - "**.md"
  workflow_dispatch:
concurrency:
  group: release
  cancel-in-progress: true
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/datadog-korea-user-group/datadog-dashboards:latest
            ghcr.io/datadog-korea-user-group/datadog-dashboards:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
