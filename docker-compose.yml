services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dashboards
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dashboards}
      POSTGRES_DB: dashboards
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboards -d dashboards"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    image: ghcr.io/datadog-korea-user-group/datadog-dashboards:${IMAGE_TAG:-latest}
    build: .   # `docker compose build` from a checkout when the registry image is not reachable
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://dashboards:${POSTGRES_PASSWORD:-dashboards}@db:5432/dashboards
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET}
      AUTH_URL: ${AUTH_URL}
      AUTH_TRUST_HOST: "true"
      SITE_URL: ${SITE_URL}
      # Comma-separated GitHub logins that get the admin role (keep it in .env, never in the repo)
      ADMIN_GITHUB_LOGINS: ${ADMIN_GITHUB_LOGINS:-}
      # Bearer token for the admin API used by the local preview runner (pnpm preview:run); empty disables it
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      # Comments/reactions via GitHub Discussions (giscus). IDs are public identifiers.
      GISCUS_REPO: ${GISCUS_REPO:-Datadog-Korea-User-Group/datadog-dashboards}
      GISCUS_REPO_ID: ${GISCUS_REPO_ID:-R_kgDOULXkRA}
      GISCUS_CATEGORY: ${GISCUS_CATEGORY:-Announcements}
      GISCUS_CATEGORY_ID: ${GISCUS_CATEGORY_ID:-DIC_kwDOULXkRM4DEsH0}
    volumes:
      # Persist only optimized images across deploys; the data cache must not outlive a build.
      - image-cache:/app/.next/cache/images
      # Screenshots of uploaded dashboards (manual uploads and the admin preview API); migrated ones ship in the image
      - uploads:/app/public/screenshots/uploads
    ports:
      - "127.0.0.1:3010:3000"
    labels:
      com.datadoghq.ad.logs: '[{"source":"nodejs","service":"datadog-dashboards"}]'

volumes:
  db-data:
  image-cache:
  uploads:
